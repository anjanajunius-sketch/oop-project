<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Register Admin')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admins')}"></nav>

<main class="container py-4">

    <div class="auth-card">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-warning bg-opacity-10 text-warning-emphasis d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
                        <i class="bi bi-shield-plus fs-3"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-1">Register a new admin</h1>
                    <p class="text-muted small mb-0">Privileged account creation.</p>
                </div>

                <div th:replace="~{fragments/layout :: alert(${error}, 'danger')}"></div>

                <form th:action="@{/admins/register}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="name">Full name</label>
                        <input id="name" name="name" type="text" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email address</label>
                        <input id="email" name="email" type="email" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input id="password" name="password" type="password" class="form-control form-control-lg" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="roleName">Role <span class="text-muted small">(optional)</span></label>
                        <input id="roleName" name="roleName" type="text" class="form-control" placeholder="SUPER_ADMIN, MODERATOR, ...">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold"><i class="bi bi-shield-plus me-2"></i>Create Admin</button>
                    </div>
                </form>

                <hr class="my-4">
                <p class="text-center small text-muted mb-0">
                    Already have an admin account? <a th:href="@{/admins/login}" class="text-success fw-semibold text-decoration-none">Sign in</a>
                </p>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
