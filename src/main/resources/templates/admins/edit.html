<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Edit Admin')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admins')}"></nav>

<header th:replace="~{fragments/layout :: page-header('Edit Admin', 'Update admin account details.', 'bi-pencil-square')}"></header>

<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <div th:replace="~{fragments/layout :: alert(${error}, 'danger')}"></div>

                    <form th:action="@{'/admins/' + ${admin.userId} + '/edit'}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Admin ID</label>
                                <input type="text" class="form-control" th:value="${admin.userId}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Type</label>
                                <input type="text" class="form-control" th:value="${admin.roleLabel}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="name">Name</label>
                                <input id="name" name="name" type="text" class="form-control" th:value="${admin.name}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">Email</label>
                                <input id="email" name="email" type="email" class="form-control" th:value="${admin.email}" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label" for="roleName">Role</label>
                                <input id="roleName" name="roleName" type="text" class="form-control" th:value="${admin.roleName}">
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Save Changes</button>
                            <a th:href="@{/admins}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
