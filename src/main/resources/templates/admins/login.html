<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Admin Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admins')}"></nav>

<main class="container py-4">

    <div class="auth-card">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-warning bg-opacity-10 text-warning-emphasis d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
                        <i class="bi bi-shield-lock fs-3"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-1">Admin Sign In</h1>
                    <p class="text-muted small mb-0">Access the management dashboard.</p>
                </div>

                <div th:replace="~{fragments/layout :: alert(${error}, 'danger')}"></div>

                <form th:action="@{/admins/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email address</label>
                        <input id="email" name="email" type="email" class="form-control form-control-lg" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input id="password" name="password" type="password" class="form-control form-control-lg" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold"><i class="bi bi-shield-check me-2"></i>Sign In</button>
                    </div>
                </form>

                <div class="alert alert-light border mt-4 small mb-0">
                    <strong class="d-block mb-1"><i class="bi bi-info-circle me-1"></i>Demo admin</strong>
                    <code class="d-block">admin@grocery.local / admin123</code>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
