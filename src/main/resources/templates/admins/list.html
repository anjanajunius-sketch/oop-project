<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Admins')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admins')}"></nav>

<header th:replace="~{fragments/layout :: page-header('Admin Accounts', 'Privileged accounts that can manage products, customers and reviews.', 'bi-shield-lock')}"></header>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <span class="text-muted small"><i class="bi bi-shield-lock me-1"></i><span th:text="${#lists.size(admins)}">0</span> admins</span>
        <a th:href="@{/admins/register}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>New Admin</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${admins}">
                    <td><code th:text="${a.userId}">U-A1</code></td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="rounded-circle bg-warning bg-opacity-10 text-warning-emphasis d-flex align-items-center justify-content-center fw-bold" style="width:36px;height:36px;" th:text="${#strings.substring(a.name,0,1)}">A</div>
                            <span class="fw-semibold" th:text="${a.name}">Admin</span>
                        </div>
                    </td>
                    <td th:text="${a.email}">admin@grocery.local</td>
                    <td><span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle" th:text="${a.roleName} ?: 'ADMIN'">SUPER_ADMIN</span></td>
                    <td class="text-end pe-3">
                        <a th:href="@{'/admins/' + ${a.userId} + '/edit'}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{'/admins/' + ${a.userId} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('Delete this admin?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(admins)}">
                    <td colspan="5" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
                        No admins yet. <a th:href="@{/admins/register}">Add one</a>.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
