<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Products')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('products')}"></nav>

<header th:replace="~{fragments/layout :: page-header('Product Catalog', 'Browse all available items in the GreenBasket store.', 'bi-bag')}"></header>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <span class="text-muted small"><i class="bi bi-grid me-1"></i><span th:text="${#lists.size(products)}">0</span> products in catalog</span>
        <a th:href="@{/products/add}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add Product</a>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="card">
        <div class="card-body text-center py-5 text-muted">
            <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
            No products yet. <a th:href="@{/products/add}">Add the first one</a>.
        </div>
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(products)}">
        <div class="col-sm-6 col-md-4 col-lg-3" th:each="p : ${products}">
            <div class="card product-card h-100">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <code class="text-muted small" th:text="${p.productId}">P-1</code>
                        <span class="badge"
                              th:classappend="${p.quantity == 0} ? 'bg-danger-subtle text-danger' : (${p.quantity < 20} ? 'bg-warning-subtle text-warning-emphasis' : 'bg-success-subtle text-success')"
                              th:text="${p.quantity == 0} ? 'Out of stock' : (${p.quantity < 20} ? 'Low stock' : 'In stock')">
                            In stock
                        </span>
                    </div>
                    <h3 class="h5 fw-semibold mb-2" th:text="${p.name}">Basmati Rice 5kg</h3>

                    <div class="mb-3 small">
                        <span class="star" th:each="i : ${#numbers.sequence(1, 5)}"
                              th:classappend="${i > p.averageRating} ? 'star-empty'">
                            <i class="bi bi-star-fill"></i>
                        </span>
                        <span class="text-muted ms-1" th:text="'(' + ${#numbers.formatDecimal(p.averageRating, 1, 1)} + ')'">(5.0)</span>
                    </div>

                    <div class="mt-auto">
                        <div class="d-flex justify-content-between align-items-end mb-3">
                            <div>
                                <div class="text-muted small">Price</div>
                                <div class="fs-4 fw-bold text-success" th:text="'LKR ' + ${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">LKR 1,850.00</div>
                            </div>
                            <div class="text-end">
                                <div class="text-muted small">Stock</div>
                                <div class="fw-semibold" th:text="${p.quantity}">50</div>
                            </div>
                        </div>
                        <div class="d-flex gap-1">
                            <a th:href="@{'/products/' + ${p.productId} + '/edit'}" class="btn btn-outline-secondary btn-sm flex-grow-1" title="Edit"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{'/reviews/product/' + ${p.productId}}" class="btn btn-outline-secondary btn-sm flex-grow-1" title="View reviews"><i class="bi bi-chat-quote"></i></a>
                            <form th:action="@{'/products/' + ${p.productId} + '/delete'}" method="post" class="flex-grow-1" onsubmit="return confirm('Delete this product?');">
                                <button type="submit" class="btn btn-outline-danger btn-sm w-100" title="Delete"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
