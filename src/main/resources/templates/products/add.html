<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Add Product')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('products')}"></nav>

<header th:replace="~{fragments/layout :: page-header('Add Product', 'Create a new item in the catalog.', 'bi-bag-plus')}"></header>

<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <div th:replace="~{fragments/layout :: alert(${error}, 'danger')}"></div>

                    <form th:action="@{/products/add}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="name">Product name</label>
                            <input id="name" name="name" type="text" class="form-control form-control-lg" required placeholder="e.g. Organic Honey 500g">
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="price">Price <span class="text-muted small">(LKR)</span></label>
                                <input id="price" name="price" type="number" min="0" step="0.01" class="form-control form-control-lg" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="quantity">Initial stock</label>
                                <input id="quantity" name="quantity" type="number" min="0" step="1" class="form-control form-control-lg" required>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Create Product</button>
                            <a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
