<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Product</title></head>
<body>
<h1>Add Product</h1>
<p><a href="/">Home</a> | <a href="/products">Products</a></p>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<form action="/products/add" method="post">
    <p>Name: <input name="name" required></p>
    <p>Price: <input name="price" type="number" step="0.01" required></p>
    <p>Quantity: <input name="quantity" type="number" required></p>
    <p><button type="submit">Add</button></p>
</form>
</body>
</html>
