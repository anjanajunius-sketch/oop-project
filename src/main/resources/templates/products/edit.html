<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Product</title></head>
<body>
<h1>Edit Product <span th:text="${product.productId}"></span></h1>
<p><a href="/">Home</a> | <a href="/products">Products</a></p>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<form th:action="@{|/products/${product.productId}/edit|}" method="post">
    <p>Name: <input name="name" th:value="${product.name}" required></p>
    <p>Price: <input name="price" type="number" step="0.01" th:value="${product.price}" required></p>
    <p>Quantity: <input name="quantity" type="number" th:value="${product.quantity}" required></p>
    <p><button type="submit">Save</button></p>
</form>
</body>
</html>
