<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cart</title></head>
<body>
<h1>Cart for <span th:text="${customer.name}"></span></h1>
<p><a href="/">Home</a> | <a th:href="@{|/cart/${customer.userId}/add|}">Add item</a> |
    <a th:href="@{|/orders/place/${customer.userId}|}">Place order</a></p>

<p>Cart ID: <span th:text="${cart.cartId}"></span></p>

<table border="1" cellpadding="6">
    <thead>
    <tr><th>Product</th><th>Unit price</th><th>Qty</th><th>Line total</th><th>Actions</th></tr>
    </thead>
    <tbody>
    <tr th:each="i : ${cart.items}">
        <td th:text="${i.product.name}"></td>
        <td th:text="${i.product.price}"></td>
        <td th:text="${i.quantity}"></td>
        <td th:text="${i.lineTotal}"></td>
        <td>
            <form th:action="@{|/cart/${customer.userId}/update|}" method="post" style="display:inline">
                <input type="hidden" name="productId" th:value="${i.product.productId}">
                <input type="number" name="qty" th:value="${i.quantity}" min="0">
                <button type="submit">update</button>
            </form>
            <form th:action="@{|/cart/${customer.userId}/remove|}" method="post" style="display:inline">
                <input type="hidden" name="productId" th:value="${i.product.productId}">
                <button type="submit">remove</button>
            </form>
        </td>
    </tr>
    <tr th:if="${cart.items.isEmpty()}">
        <td colspan="5"><em>Cart is empty</em></td>
    </tr>
    </tbody>
    <tfoot>
    <tr><th colspan="3">Total</th><th th:text="${total}">0</th><th>
        <form th:action="@{|/cart/${customer.userId}/clear|}" method="post" style="display:inline">
            <button type="submit">clear cart</button>
        </form>
    </th></tr>
    </tfoot>
</table>
</body>
</html>
