<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Customer Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('customers')}"></nav>

<main class="container py-4">

    <div class="auth-card">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary-soft text-success d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
                        <i class="bi bi-box-arrow-in-right fs-3"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-1">Welcome back</h1>
                    <p class="text-muted small mb-0">Sign in to view your profile.</p>
                </div>

                <div th:replace="~{fragments/layout :: alert(${error}, 'danger')}"></div>

                <form th:action="@{/customers/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email address</label>
                        <input id="email" name="email" type="email" class="form-control form-control-lg" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input id="password" name="password" type="password" class="form-control form-control-lg" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
                    </div>
                </form>

                <hr class="my-4">
                <p class="text-center small text-muted mb-0">
                    Don't have an account? <a th:href="@{/customers/register}" class="text-success fw-semibold text-decoration-none">Create one</a>
                </p>

                <div class="alert alert-light border mt-4 small mb-0">
                    <strong class="d-block mb-1"><i class="bi bi-info-circle me-1"></i>Demo accounts</strong>
                    <code class="d-block">alice@example.com / pass123</code>
                    <code class="d-block">bimal@example.com / pass123</code>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
