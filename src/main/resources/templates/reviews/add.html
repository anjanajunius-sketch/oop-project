<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Write a Review')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('reviews')}"></nav>

<header th:replace="~{fragments/layout :: page-header('Write a Review', 'Share your experience with a product.', 'bi-pencil')}"></header>

<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <div th:replace="~{fragments/layout :: alert(${error}, 'danger')}"></div>

                    <form th:action="@{/reviews/add}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="customerId">Customer</label>
                            <select id="customerId" name="customerId" class="form-select form-select-lg" required>
                                <option value="" disabled selected>— select customer —</option>
                                <option th:each="c : ${customers}" th:value="${c.userId}" th:text="${c.name} + ' (' + ${c.userId} + ')'">Alice</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="productId">Product</label>
                            <select id="productId" name="productId" class="form-select form-select-lg" required>
                                <option value="" disabled selected>— select product —</option>
                                <option th:each="p : ${products}" th:value="${p.productId}" th:text="${p.name}">Basmati Rice</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="rating">Rating</label>
                            <select id="rating" name="rating" class="form-select form-select-lg" required>
                                <option value="" disabled selected>— rating —</option>
                                <option value="5">★★★★★ — Excellent</option>
                                <option value="4">★★★★☆ — Good</option>
                                <option value="3">★★★☆☆ — Average</option>
                                <option value="2">★★☆☆☆ — Poor</option>
                                <option value="1">★☆☆☆☆ — Bad</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="comment">Comment <span class="text-muted small">(optional)</span></label>
                            <textarea id="comment" name="comment" rows="4" class="form-control" placeholder="Tell others what you liked or disliked..."></textarea>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Submit Review</button>
                            <a th:href="@{/reviews}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
