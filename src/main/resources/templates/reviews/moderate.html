<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Moderate Reviews')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('reviews')}"></nav>

<header th:replace="~{fragments/layout :: page-header('Moderate Reviews', 'Approve, hide or remove customer-submitted reviews.', 'bi-shield-check')}"></header>

<main class="container py-4">

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Customer</th>
                    <th>Rating</th>
                    <th>Comment</th>
                    <th>Status</th>
                    <th class="text-end pe-4">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reviews}">
                    <td><code th:text="${r.reviewId}">R-1</code></td>
                    <td th:text="${r.product.name}">Basmati Rice</td>
                    <td th:text="${r.customer.name}">Alice</td>
                    <td>
                        <span class="star" th:each="i : ${#numbers.sequence(1, 5)}"
                              th:classappend="${i > r.rating} ? 'star-empty'">
                            <i class="bi bi-star-fill"></i>
                        </span>
                    </td>
                    <td class="text-muted small text-truncate" style="max-width: 240px;" th:text="${r.comment} ?: '—'">Excellent rice</td>
                    <td>
                        <span class="badge" th:classappend="${r.moderated} ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning-emphasis'"
                              th:text="${r.moderated} ? 'Approved' : 'Pending'">Pending</span>
                    </td>
                    <td class="text-end pe-3">
                        <form th:action="@{'/reviews/' + ${r.reviewId} + '/moderate'}" method="post" class="d-inline" th:if="${!r.moderated}">
                            <input type="hidden" name="approve" value="true">
                            <button type="submit" class="btn btn-sm btn-success"><i class="bi bi-check2 me-1"></i>Approve</button>
                        </form>
                        <form th:action="@{'/reviews/' + ${r.reviewId} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('Delete this review? This cannot be undone.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Reject</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reviews)}">
                    <td colspan="7" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
                        No reviews to moderate.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
