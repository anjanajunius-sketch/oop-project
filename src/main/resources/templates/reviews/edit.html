<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Review</title></head>
<body>
<h1>Edit Review <span th:text="${review.reviewId}"></span></h1>
<p><a href="/">Home</a> | <a href="/reviews">Reviews</a></p>
<form th:action="@{|/reviews/${review.reviewId}/edit|}" method="post">
    <p>Rating: <input name="rating" type="number" min="1" max="5" th:value="${review.rating}" required></p>
    <p>Comment: <textarea name="comment" rows="3" cols="40" th:text="${review.comment}"></textarea></p>
    <p><button type="submit">Save</button></p>
</form>
</body>
</html>
