<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Edit Review')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('reviews')}"></nav>

<header th:replace="~{fragments/layout :: page-header('Edit Review', 'Update rating or comment.', 'bi-pencil-square')}"></header>

<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <p class="text-muted small mb-3">
                        <strong th:text="${review.product.name}">Basmati Rice</strong> &middot;
                        by <span th:text="${review.customer.name}">Alice</span> &middot;
                        <code th:text="${review.reviewId}">R-1</code>
                    </p>

                    <form th:action="@{'/reviews/' + ${review.reviewId} + '/edit'}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="rating">Rating</label>
                            <select id="rating" name="rating" class="form-select form-select-lg" required>
                                <option value="5" th:selected="${review.rating == 5}">★★★★★ — Excellent</option>
                                <option value="4" th:selected="${review.rating == 4}">★★★★☆ — Good</option>
                                <option value="3" th:selected="${review.rating == 3}">★★★☆☆ — Average</option>
                                <option value="2" th:selected="${review.rating == 2}">★★☆☆☆ — Poor</option>
                                <option value="1" th:selected="${review.rating == 1}">★☆☆☆☆ — Bad</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="comment">Comment</label>
                            <textarea id="comment" name="comment" rows="4" class="form-control" th:text="${review.comment}"></textarea>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Save Changes</button>
                            <a th:href="@{/reviews}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
