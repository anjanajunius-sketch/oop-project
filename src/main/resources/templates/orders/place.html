<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Place Order')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('orders')}"></nav>

<header th:replace="~{fragments/layout :: page-header('Place Order', 'Convert your current cart contents into an order.', 'bi-bag-check')}"></header>

<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <div th:replace="~{fragments/layout :: alert(${error}, 'danger')}"></div>

                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="rounded-circle bg-primary-soft text-success d-flex align-items-center justify-content-center fw-bold" style="width:56px;height:56px;font-size:1.25rem;" th:text="${#strings.substring(customer.name,0,1)}">A</div>
                        <div>
                            <div class="fw-semibold" th:text="${customer.name}">Alice Perera</div>
                            <div class="small text-muted">ID: <code th:text="${customer.userId}">U-C1</code></div>
                        </div>
                    </div>

                    <p class="text-muted">When you confirm, every item currently in this customer's cart becomes a single order. The cart is emptied automatically.</p>

                    <form th:action="@{'/orders/place/' + ${customer.userId}}" method="post" class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold flex-grow-1"><i class="bi bi-bag-check me-2"></i>Confirm &amp; Place Order</button>
                        <a th:href="@{'/cart/' + ${customer.userId}}" class="btn btn-outline-secondary btn-lg">Back to Cart</a>
                    </form>

                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
