# MySQL / MariaDB profile.
# Activate with one of:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#   SPRING_PROFILES_ACTIVE=mysql ./mvnw spring-boot:run
# In IntelliJ Run Configuration: Modify options -> "Active profiles" = mysql
#
# Credentials are read from environment variables so they never go in git.
# Set DB_URL, DB_USER, DB_PASSWORD in your IntelliJ Run Configuration
# (Modify options -> "Environment variables") or your shell.
#
# Example DB_URL for cPanel MySQL:
#   jdbc:mysql://srv123.providername.com:3306/cpaneluser_grocery?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Use the generic MySQL dialect; works for both MySQL 5.7+/8 and MariaDB 10+.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate generates / updates the schema from the JPA entities on first run,
# then preserves user-created data across restarts. No need to run schema.sql
# against the cPanel database manually.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Skip the H2-flavored schema.sql / data.sql under src/main/resources.
spring.sql.init.mode=never

# H2 console is meaningless against MySQL.
spring.h2.console.enabled=false

# Connection-pool tuning suitable for a remote DB (slower than local H2).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
