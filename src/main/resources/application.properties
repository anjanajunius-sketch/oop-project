spring.application.name=oop-project
server.port=8080

# ---------------------------------------------------------------
# Datasource: cPanel MySQL / MariaDB
# ---------------------------------------------------------------
# Credentials are read from environment variables so the password
# never lands in git. Set them in IntelliJ:
#   Run > Edit Configurations -> OopProjectApplication
#     -> Modify options -> "Environment variables"
#   Then add (one row per variable):
#     DB_URL=jdbc:mysql://us101.serverclubservers.com:3306/paperzon_oop?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
#     DB_USER=paperzon_oop
#     DB_PASSWORD=<your real cPanel password>
#
# If DB_URL / DB_USER are missing, sensible defaults are used so
# the project still starts and you get a clear "Access denied" /
# "Communications link failure" instead of a placeholder error.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://us101.serverclubservers.com:3306/paperzon_oop?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:paperzon_oop}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}

# Generic MySQL dialect — works for both MySQL 5.7+/8 and MariaDB 10+.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate creates / updates the 8 tables from the JPA entities on
# first run, then preserves user data across restarts. No need to
# import schema.sql into cPanel manually.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Skip the H2-flavoured schema.sql / data.sql under src/main/resources.
# SeedDataRunner inserts the 5 demo products + 1 admin + 2 customers + 1 review idempotently.
spring.sql.init.mode=never

# H2 console is meaningless against MySQL.
spring.h2.console.enabled=false

# Connection-pool tuning suitable for a remote DB (slower than local H2).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

# Thymeleaf — disable cache during dev so template edits hot-reload.
spring.thymeleaf.cache=false

logging.level.org.hibernate.SQL=INFO
