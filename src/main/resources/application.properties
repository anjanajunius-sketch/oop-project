spring.application.name=oop-project
server.port=8080

# ---------- Default datasource: H2 (file-based, SQL) ----------
# Zero-setup so the app runs out of the box for the progress demo.
# H2 file lives at ./data/grocery.mv.db (relative to project working dir).
spring.datasource.url=jdbc:h2:file:./data/grocery;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Use schema.sql / data.sql under src/main/resources every startup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- MySQL (commented) ----------
# To swap to MySQL: comment out the H2 block above, uncomment the lines below,
# create a database named `grocery` (CREATE DATABASE grocery;) and adjust
# username/password.
#spring.datasource.url=jdbc:mysql://localhost:3306/grocery?useSSL=false&serverTimezone=UTC
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=root
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Thymeleaf — disable cache during dev so template edits hot-reload.
spring.thymeleaf.cache=false

logging.level.org.hibernate.SQL=INFO
