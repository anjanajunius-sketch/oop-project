spring.application.name=oop-project-test
server.port=0

# In-memory H2 with MySQL compatibility — used by `mvn test` only
# so context-load tests don't need access to the real cPanel DB.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.h2.console.enabled=false
spring.thymeleaf.cache=false
